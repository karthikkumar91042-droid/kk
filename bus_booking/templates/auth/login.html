{% extends 'base.html' %}
{% block title %}Login - BusGo{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-sign-in-alt auth-icon"></i>
            <h2>Welcome Back</h2>
            <p>Sign in to your BusGo account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" onclick="togglePass()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-auth">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        <div class="demo-credentials">
            <p><i class="fas fa-info-circle"></i> <strong>Demo Admin:</strong> admin@busbook.com / admin123</p>
        </div>
        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePass() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
