{% extends 'base.html' %}
{% block title %}Register - BusGo{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus auth-icon"></i>
            <h2>Create Account</h2>
            <p>Join BusGo and start booking today</p>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" id="registerForm">
            <div class="form-group">
                <label for="name"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit phone number"
                       pattern="[6-9][0-9]{9}" required autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    <button type="button" class="toggle-password" onclick="togglePass('password')">
                        <i class="fas fa-eye" id="eyeIcon1"></i>
                    </button>
                </div>
                <div class="password-strength" id="strength"></div>
            </div>
            <div class="form-group">
                <label for="confirm_password"><i class="fas fa-lock"></i> Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password"
                           placeholder="Confirm your password" required>
                    <button type="button" class="toggle-password" onclick="togglePass('confirm_password')">
                        <i class="fas fa-eye" id="eyeIcon2"></i>
                    </button>
                </div>
                <div class="password-match" id="matchMsg"></div>
            </div>
            <button type="submit" class="btn-auth">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePass(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
}

document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const el = document.getElementById('strength');
    let strength = 0;
    if (val.length >= 8) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;
    const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    const colors = ['', '#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
    el.textContent = strength ? 'Strength: ' + labels[strength] : '';
    el.style.color = colors[strength] || '';
});

document.getElementById('confirm_password').addEventListener('input', function() {
    const pw = document.getElementById('password').value;
    const msg = document.getElementById('matchMsg');
    if (this.value === pw) {
        msg.textContent = '✓ Passwords match';
        msg.style.color = '#10b981';
    } else {
        msg.textContent = '✗ Passwords do not match';
        msg.style.color = '#ef4444';
    }
});
</script>
{% endblock %}
