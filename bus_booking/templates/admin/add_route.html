{% extends 'base.html' %}
{% block title %}Add Route - Admin{% endblock %}
{% block content %}
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="admin-brand"><i class="fas fa-cogs"></i> Admin Panel</div>
        <nav class="admin-nav">
            <a href="{{ url_for('admin.dashboard') }}" class="admin-nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="{{ url_for('admin.buses') }}" class="admin-nav-link"><i class="fas fa-bus"></i> Buses</a>
            <a href="{{ url_for('admin.routes') }}" class="admin-nav-link active"><i class="fas fa-route"></i> Routes</a>
            <a href="{{ url_for('admin.schedules') }}" class="admin-nav-link"><i class="fas fa-calendar-alt"></i> Schedules</a>
            <a href="{{ url_for('admin.bookings') }}" class="admin-nav-link"><i class="fas fa-ticket-alt"></i> Bookings</a>
            <a href="{{ url_for('admin.users') }}" class="admin-nav-link"><i class="fas fa-users"></i> Users</a>
        </nav>
    </aside>
    <div class="admin-content">
        <div class="admin-topbar">
            <h1><i class="fas fa-plus-circle"></i> Add New Route</h1>
            <a href="{{ url_for('admin.routes') }}" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <div class="admin-form-card">
            <form method="POST">
                <div class="form-group">
                    <label>Source City *</label>
                    <input type="text" name="source" placeholder="e.g. Bangalore" required>
                </div>
                <div class="form-group">
                    <label>Destination City *</label>
                    <input type="text" name="destination" placeholder="e.g. Chennai" required>
                </div>
                <div class="form-group">
                    <label>Distance (km) *</label>
                    <input type="number" name="distance_km" step="0.1" min="1" placeholder="e.g. 350" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Add Route</button>
                    <a href="{{ url_for('admin.routes') }}" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
