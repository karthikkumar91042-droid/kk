{% extends 'base.html' %}
{% block title %}Add Schedule - Admin{% endblock %}
{% block content %}
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <div class="admin-brand"><i class="fas fa-cogs"></i> Admin Panel</div>
        <nav class="admin-nav">
            <a href="{{ url_for('admin.dashboard') }}" class="admin-nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="{{ url_for('admin.buses') }}" class="admin-nav-link"><i class="fas fa-bus"></i> Buses</a>
            <a href="{{ url_for('admin.routes') }}" class="admin-nav-link"><i class="fas fa-route"></i> Routes</a>
            <a href="{{ url_for('admin.schedules') }}" class="admin-nav-link active"><i class="fas fa-calendar-alt"></i> Schedules</a>
            <a href="{{ url_for('admin.bookings') }}" class="admin-nav-link"><i class="fas fa-ticket-alt"></i> Bookings</a>
            <a href="{{ url_for('admin.users') }}" class="admin-nav-link"><i class="fas fa-users"></i> Users</a>
        </nav>
    </aside>
    <div class="admin-content">
        <div class="admin-topbar">
            <h1><i class="fas fa-plus-circle"></i> Add New Schedule</h1>
            <a href="{{ url_for('admin.schedules') }}" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <div class="admin-form-card">
            <form method="POST">
                <div class="form-group">
                    <label>Bus *</label>
                    <select name="bus_id" required>
                        <option value="">Select Bus</option>
                        {% for bus in buses %}
                        <option value="{{ bus.id }}">{{ bus.bus_name }} ({{ bus.bus_number }}) - {{ bus.total_seats }} seats</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Route *</label>
                    <select name="route_id" required>
                        <option value="">Select Route</option>
                        {% for route in routes %}
                        <option value="{{ route.id }}">{{ route.source }} → {{ route.destination }} ({{ route.distance_km|int }} km)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Travel Date *</label>
                        <input type="date" name="travel_date" required>
                    </div>
                    <div class="form-group">
                        <label>Departure Time *</label>
                        <input type="time" name="departure_time" required>
                    </div>
                    <div class="form-group">
                        <label>Arrival Time *</label>
                        <input type="time" name="arrival_time" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Price per Seat (₹) *</label>
                    <input type="number" name="price" step="0.01" min="1" placeholder="e.g. 850" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Add Schedule</button>
                    <a href="{{ url_for('admin.schedules') }}" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
